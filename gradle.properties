# group mirrors pom.xml's <groupId> (line 21). version is intentionally NOT the upstream
# <revision> (5.4.0-SNAPSHOT) - this fork versions independently, starting at 1.0.0-SNAPSHOT,
# so there's no implication of drop-in compatibility with a specific upstream Axon release.
# Gradle applies root-project-level `group`/`version` gradle.properties keys automatically;
# propagating them to every subproject is done in the build-logic convention plugins (not yet built).
group=org.axonframework
version=1.0.0-SNAPSHOT
