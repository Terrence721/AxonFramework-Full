name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # No Gradle wrapper in this repo yet (todo.md item 7) - gradle-version installs Gradle
      # directly instead of relying on ./gradlew. Pinned to 9.2, matching what's been used
      # locally throughout this migration. Dependency caching is on by default.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2'

      - run: gradle build
