name: Build

run-name: "Build: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # Wrapper bootstrapped 2026-08-25 (todo.md item 7, now done) - setup-gradle detects and uses
      # gradlew automatically, no gradle-version needed. Dependency caching is on by default.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build
